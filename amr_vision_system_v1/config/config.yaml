
app:
  name: amr_vision_system_v1
  log_dir: logs
  results_dir: results

camera:
  source: usb            # usb | ros
  usb:
    index: 2
    width: null          # set e.g. 640
    height: null         # set e.g. 480
    fps: null
    reconnect: true
    reconnect_wait_s: 0.5
  ros:
    topic: /camera/image_raw
    encoding: bgr8
    spin_timeout_s: 0.01

preprocess:
  enabled: true
  resize:
    enabled: true
    width: 640
    height: 480
    keep_aspect: false
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_grid_size: [8, 8]
  denoise:
    enabled: false
    h: 5
    h_color: 5
    template_window_size: 7
    search_window_size: 21

detection:
  mode: hybrid           # yolo | classical | hybrid
  confidence: 0.8

  yolo:
    enabled: true
    weights_path: /home/user/YOLO/runs/train33/weights/best.pt
    imgsz: 640
    device: null         # null lets ultralytics choose
    iou: 0.45
    max_det: 100

  classical:
    enabled: true
    qr:
      enabled: true
    color:
      enabled: true
      min_area: 2500
      hsv_ranges:
        # Tuned HSV ranges from opencv/colour hsv,area/3_colour_hsv.py
        red1: [[0, 120, 70], [10, 255, 255]]
        red2: [[170, 120, 70], [180, 255, 255]]
        green: [[36, 50, 70], [89, 255, 255]]
        blue: [[94, 80, 2], [126, 255, 255]]
        orange: [[10, 120, 80], [25, 255, 255]]
        yellow: [[25, 120, 120], [35, 255, 255]]
        black: [[0, 0, 0], [180, 255, 50]]
    contour:
      enabled: false
      min_area: 2000

postprocess:
  enabled: true
  min_confidence: 0.5

mapping:
  enabled: true
  grid:
    rows: 8
    cols: 8
    origin: top_left      # top_left
    labels:
      cols: ABCDEFGH
      rows: "87654321"

output:
  format: csv       # json | csv
  write_outputs: true
  # When append=true:
  # - JSON output becomes JSON Lines (one JSON object per line / per frame)
  # - CSV output appends rows (keeps full history)
  append: false
  include_empty_frames: false
  json_path: results/output.json
  csv_path: results/output.csv
  image_path: results/annotated.jpg
  save_image: false      # set true only when you want per-frame annotated image writes

visualization:
  enabled: true
  show_window: true
  window_name: AMR Vision V1
  draw_grid: true
  draw_labels: true
  draw_confidence: true
